<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة المتكامل | تجربة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* تصميم فخم بلمسات زرقاء ورمادية داكنة */
        :root {
            --bg-dark: #121417;
            --card-bg: #1e2126;
            --accent-blue: #00d2ff;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --success: #00b894;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        .container { max-width: 1100px; margin: auto; }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .status-badge {
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent-blue);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid var(--accent-blue);
        }

        /* كروت الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #2d2d2d;
            transition: 0.3s;
        }

        .stat-card:hover { transform: translateY(-5px); border-color: var(--accent-blue); }
        .stat-card h3 { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 10px; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; color: var(--accent-blue); }

        /* الأقسام الرئيسية */
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #2d2d2d;
        }

        h2 { font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        h2::before { content: ''; width: 5px; height: 20px; background: var(--accent-blue); display: inline-block; border-radius: 5px; }

        /* النموذج */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 0.9rem; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #25282e;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: white;
            outline: none;
            resize: none;
        }
        input:focus { border-color: var(--accent-blue); }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; box-shadow: 0 5px 15px rgba(0,210,255,0.3); }

        /* قائمة التعاميم */
        .announcement-item {
            background: #25282e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border-right: 4px solid var(--accent-blue);
            animation: fadeIn 0.5s ease;
        }

        /* السجل (Logs) */
        .log-list { font-family: monospace; font-size: 0.8rem; color: #00ff88; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 2px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>نظام الإدارة المركزية</h1>
            <p style="color: var(--text-dim);">لوحة التحكم التجريبية - v1.0</p>
        </div>
        <div class="status-badge">النظام متصل (Live)</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><h3>إجمالي الأعضاء</h3><p id="memberCount">1,240</p></div>
        <div class="stat-card"><h3>البلاغات اليومية</h3><p>42</p></div>
        <div class="stat-card"><h3>حالة السيرفر</h3><p style="color: var(--success);">مستقر</p></div>
    </div>

    <div class="main-content">
        <div class="card">
            <h2>إصدار تعميم جديد</h2>
            <div class="form-group">
                <label>نص التعميم الإداري</label>
                <textarea id="annContent" rows="4" placeholder="اكتب التعليمات هنا..."></textarea>
            </div>
            <button onclick="postAnn()">نشر التعميم فوراً</button>

            <div id="annArea" style="margin-top: 30px;">
                <h2 style="font-size: 1rem; color: var(--text-dim);">التعاميم النشطة</h2>
                <div id="annList">
                    <div class="announcement-item">أهلاً بك في النسخة التجريبية، يمكنك البدء بإضافة مهامك.</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>سجل العمليات</h2>
            <div id="logArea" class="log-list">
                <div class="log-entry">> جاري تشغيل النظام...</div>
                <div class="log-entry">> تم تحميل الواجهة بنجاح.</div>
            </div>
        </div>
    </div>
</div>

<script>
    function addLog(message) {
        const logArea = document.getElementById('logArea');
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerText = `> [${time}] ${message}`;
        logArea.prepend(entry);
    }

    function postAnn() {
        const content = document.getElementById('annContent').value;
        const annList = document.getElementById('annList');

        if (content.trim() === "") {
            alert("يرجى كتابة نص التعميم!");
            return;
        }

        // إضافة التعميم للواجهة
        const item = document.createElement('div');
        item.className = 'announcement-item';
        item.innerText = content;
        annList.prepend(item);

        // إضافة سجل
        addLog("تم نشر تعميم جديد بنجاح.");
        
        // مسح الخانة
        document.getElementById('annContent').value = "";
    }

    // إضافة سجل عشوائي كل 10 ثوانٍ للمحاكاة
    setInterval(() => {
        addLog("فحص روتيني لاستقرار النظام...");
    }, 10000);
</script>

</body>
</html>
