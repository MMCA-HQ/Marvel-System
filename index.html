<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة المتكامل</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- قسم التصميم (CSS) --- */
        :root {
            --primary-color: #0984e3;
            --bg-color: #f0f2f5;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--text-dark);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 0 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0773c5;
            transform: translateY(-2px);
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 12px;
            border-right: 6px solid var(--primary-color);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.4s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .delete-btn {
            background: #ff7675;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 5px;
        }

        .delete-btn:hover {
            background: #d63031;
        }

        .empty-state {
            text-align: center;
            color: var(--text-light);
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header>
            <h1>نظام إدارة العمليات</h1>
            <p>تحكم بمهامك وبياناتك بسهولة</p>
        </header>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="أضف مهمة أو بلاغ جديد...">
            <button onclick="addNewTask()">إضافة</button>
        </div>

        <ul id="taskList" class="task-list">
            </ul>
        
        <div id="emptyMsg" class="empty-state">لا توجد مهام حالياً..</div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const emptyMsg = document.getElementById('emptyMsg');

        // مصفوفة لتخزين البيانات مؤقتاً
        let dataStore = [];

        function render() {
            // مسح القائمة الحالية قبل إعادة الرسم
            taskList.innerHTML = "";
            
            if (dataStore.length === 0) {
                emptyMsg.style.display = "block";
            } else {
                emptyMsg.style.display = "none";
                
                dataStore.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    li.innerHTML = `
                        <div>
                            <strong>#${index + 1}</strong>
                            <span>${item}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTask(${index})">حذف</button>
                    `;
                    taskList.appendChild(li);
                });
            }
        }

        function addNewTask() {
            const val = taskInput.value.trim();
            if (val !== "") {
                dataStore.push(val);
                taskInput.value = ""; // تنظيف الحقل
                render(); // تحديث الواجهة
            } else {
                alert("يرجى كتابة شيء أولاً!");
            }
        }

        function deleteTask(index) {
            dataStore.splice(index, 1);
            render();
        }

        // تشغيل أولي
        render();

        // تفعيل الإضافة عند الضغط على زر Enter
        taskInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addNewTask();
            }
        });
    </script>
</body>
</html>
